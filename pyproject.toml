[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "macaw-messenger"
version = "0.1.0"
description = "A local-first, encrypted peer-to-peer terminal messenger."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Macaw contributors" }]
dependencies = [
    "cryptography>=44.0",
    "msgpack>=1.1",
    "PyNaCl>=1.5",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
sqlcipher = ["sqlcipher3-binary>=0.5"]
dev = ["pytest>=8.3"]

[project.scripts]
macaw = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["cli*", "config*", "contacts*", "crypto*", "network*", "storage*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

